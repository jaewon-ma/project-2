<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expertise Sharing Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Step 1: pick a role -->
  <section id="role-picker">
    <h1>Expertise Sharing</h1>
    <p>Who are you?</p>
    <button data-role="expert">I'm the Expert</button>
    <button data-role="novice">I'm the Novice</button>
  </section>

  <!-- Step 2: the shared workspace -->
  <section id="workspace" hidden>
    <header>
      <span>You are the <strong id="my-role"></strong></span>
      <span id="online"></span>
    </header>

    <!-- Later: the fake Blender image goes here, with the expert's stick
         figure and the novice's clickable buttons drawn on top of it. -->
    <div id="stage">
      <div id="led"></div>
      <button id="led-button">Toggle LED</button>
      <p id="last-changed"></p>
    </div>

    <p id="error"></p>
  </section>

  <script src="app.js"></script>
</body>
</html>
